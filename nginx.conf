# ============================================================
# Nginx Configuration for Options Greeks Calculator
# Production-grade with security, caching, compression, and monitoring
# ============================================================

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" '
                'rt=$request_time uct="$upstream_connect_time" '
                'uht="$upstream_header_time" urt="$upstream_response_time"';

# Upstream backend server
upstream backend {
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================================
# Server Configuration
# ============================================================
server {
    listen 80 default_server;
    server_name _;
    
    # ============================================================
    # Security Headers
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.plot.ly https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: https:; frame-ancestors 'none';" always;
    
    # ============================================================
    # Performance & Limits
    # ============================================================
    client_max_body_size 10M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s 5s;
    send_timeout 10s;
    
    # Buffer sizes
    client_body_buffer_size 128k;
    
    # ============================================================
    # Gzip Compression
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml+rss 
        application/atom+xml 
        image/svg+xml;
    gzip_min_length 1024;
    gzip_disable "msie6";
    
    # ============================================================
    # Caching Zones
    # ============================================================
    # Cache for API responses
    
    # ============================================================
    # Frontend Routes
    # ============================================================
    
    # Root - HTML
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        
        # HTML caching policy
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header ETag "\"$http_etag\"" always;
    }
    
    # Static files - long-term caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        
        # Long-term caching for static assets with content hash
        expires 90d;
        add_header Cache-Control "public, immutable" always;
        add_header ETag "\"$http_etag\"" always;
        
        access_log off;
    }
    
    # ============================================================
    # API Routes with Caching
    # ============================================================
    
    # Calculate Greeks endpoint - cache GET requests
    location ~ ^/api/calculate-greeks$ {
        # Only allow POST
        limit_except POST {
            deny all;
        }
        
        proxy_pass http://backend;
        include proxy_headers.conf;
        
        # No caching for POST requests
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    
    # Greeks surface endpoint
    location ~ ^/api/greeks-surface$ {
        limit_except POST {
            deny all;
        }
        
        proxy_pass http://backend;
        include proxy_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    
    # Market data endpoint - cache GET requests
    location ~ ^/api/market-data/ {
        limit_except GET {
            deny all;
        }
        
        proxy_pass http://backend;
        include proxy_headers.conf;
        
        # Cache market data for 5 minutes
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Health check endpoint
    location ~ ^/(api/)?health$ {
        access_log off;
        proxy_pass http://backend;
        include proxy_headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    
    # All other API requests
    location /api {
        proxy_pass http://backend;
        include proxy_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    
    # ============================================================
    # Security
    # ============================================================
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~ \.(env|yml|yaml|conf|config|sql|sqlite|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ============================================================
    # Logging
    # ============================================================
    
    # Access log format with additional fields
    
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log warn;
}
