version: '3.8'

# Production Docker Compose Configuration
# For production deployments with security hardening, resource limits, and monitoring

services:
  # ============================================================
  # Backend API Service
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greeks-calculator-backend-prod
    restart: on-failure:5
    
    # Port mapping (should be behind reverse proxy in production)
    ports:
      - "127.0.0.1:8000:8000"  # Only localhost access, use nginx reverse proxy
    
    # Environment configuration
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - LOG_FORMAT=json
      - CORS_ORIGINS=https://yourdomain.com
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_PERIOD=60
      - SECURITY_HEADERS_ENABLED=true
      - MARKET_DATA_CACHE_ENABLED=true
      - MARKET_DATA_CACHE_TTL=300
    
    # Volume mounts
    volumes:
      - backend-logs:/app/logs
      - ./backend/.env:/app/.env:ro  # Read-only .env file
    
    # Network configuration
    networks:
      - greeks-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=greeks-backend"


  # ============================================================
  # Frontend Service (Nginx Reverse Proxy)
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: greeks-calculator-frontend-prod
    restart: on-failure:5
    
    # Port mapping
    ports:
      - "80:80"
      - "443:443"
    
    # Volume mounts
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - nginx-cache:/var/cache/nginx
      - ./certs:/etc/nginx/certs:ro
    
    # Network configuration
    networks:
      - greeks-network
    
    # Dependencies
    depends_on:
      backend:
        condition: service_healthy
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=greeks-frontend"


# ============================================================
# Volumes for data persistence
# ============================================================
volumes:
  backend-logs:
    driver: local
  nginx-cache:
    driver: local


# ============================================================
# Networks
# ============================================================
networks:
  greeks-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
