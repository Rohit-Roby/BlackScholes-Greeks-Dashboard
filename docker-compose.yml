version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greeks-calculator-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - greeks-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Frontend Service (Nginx)
  frontend:
    image: nginx:alpine
    container_name: greeks-calculator-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    networks:
      - greeks-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  greeks-network:
    driver: bridge
